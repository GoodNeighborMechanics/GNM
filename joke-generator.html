<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Random Joke Generator</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n            justify-content: center;\n            height: 100vh;\n            background-color: #f0f0f0;\n            margin: 0;\n        }\n        #joke {\n            font-size: 24px;\n            margin: 20px;\n            text-align: center;\n        }\n        #loading {\n            display: none;\n            font-size: 20px;\n            color: #999;\n        }\n        button {\n            padding: 10px 20px;\n            font-size: 16px;\n            cursor: pointer;\n            background-color: #008CBA;\n            color: white;\n            border: none;\n            border-radius: 5px;\n        }\n    </style>\n</head>\n<body>\n    <div id="joke">Click the button to get a joke!</div>\n    <div id="loading">Loading...</div>\n    <button id="getJoke">Get New Joke</button>\n    <div style="margin-top: 30px; text-align: center;">\n        <p>Contact us: info@goodneighbormechanics.com</p>\n    </div>\n    <script>\n        document.getElementById('getJoke').addEventListener('click', fetchJoke);\n        async function fetchJoke() {\n            const loadingText = document.getElementById('loading');\n            const jokeText = document.getElementById('joke');\n            loadingText.style.display = 'block';\n            jokeText.style.display = 'none';\n            try {\n                const response = await fetch('https://v2.jokeapi.dev/joke/Any');\n                if (!response.ok) throw new Error('Network response was not ok');\n                const data = await response.json();\n                if (data.type === 'single') {\n                    jokeText.innerText = data.joke;\n                } else {\n                    jokeText.innerText = data.setup + '\\n' + data.delivery;\n                }\n            } catch (error) {\n                jokeText.innerText = 'Oops! Sorry, something went wrong. Please try again.';\n            } finally {\n                loadingText.style.display = 'none';\n                jokeText.style.display = 'block';\n            }\n        }\n    <\/script>\n</body>\n</html>
